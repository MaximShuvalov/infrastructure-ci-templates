name: AI PR Summary

on:
  workflow_call:
    inputs:
      model:
        description: 'LLM Model identifier'
        required: false
        type: string
        default: 'qwen/qwen-2.5-coder-32b-instruct:free'
      temperature:
        description: 'Sampling temperature'
        required: false
        type: string
        default: '0.2'
      extra_instructions:
        description: 'Additional context for the system prompt'
        required: false
        type: string
        default: ''
    secrets:
      LLM_API_KEY:
        description: 'API key for OpenRouter'
        required: true

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Update PR Summary
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          MODEL: ${{ inputs.model }}
          TEMP: ${{ inputs.temperature }}
          EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
        run: |
          DIFF_STAT=$(git diff --stat $BASE_SHA...$HEAD_SHA)
          COMMITS=$(git log --oneline --no-merges $BASE_SHA...$HEAD_SHA)

          jq -n \
            --arg model "$MODEL" \
            --arg temp "$TEMP" \
            --arg diff "$DIFF_STAT" \
            --arg commits "$COMMITS" \
            --arg extra "$EXTRA_INSTRUCTIONS" \
            '{
              model: $model,
              messages: [
                {
                  role: "system",
                  content: ("Ты — Senior разработчик и архитектор. Пиши краткие, сухие и технические описания для Pull Request на русском языке. Без воды, вступлений и общих фраз. " + $extra)
                },
                {
                  role: "user",
                  content: ("Напиши описание для PR на русском.\n\nИзменения в файлах:\n" + $diff + "\n\nИстория коммитов:\n" + $commits + "\n\nФормат ответа (Markdown):\n### Описание изменений\n[Краткая суть]\n\n### Ключевые изменения\n- [Пункт 1]\n- [Пункт 2]\n\n### Breaking Changes\n[Нет / Описание]")
                }
              ],
              temperature: ($temp | tonumber)
            }' > payload.json

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
            -H "X-Title: GitHub PR Summary" \
            -d @payload.json)

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Не удалось сгенерировать описание"')

          CURRENT_BODY=$(gh pr view $PR_NUMBER --json body -q '.body')
          
          if [[ "$CURRENT_BODY" == "null" || -z "$CURRENT_BODY" ]]; then
            gh pr edit $PR_NUMBER --body "$SUMMARY"
          else
            gh pr edit $PR_NUMBER --body "${CURRENT_BODY}

          ---
          ### AI Summary
          ${SUMMARY}"
          fi