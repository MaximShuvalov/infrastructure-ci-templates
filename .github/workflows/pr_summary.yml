name: AI PR Summary

on:
  workflow_call:
    inputs:
      model:
        description: 'LLM Model identifier'
        required: false
        type: string
        default: 'qwen/qwen-2.5-coder-32b-instruct:free'
      temperature:
        description: 'Sampling temperature'
        required: false
        type: string
        default: '0.2'
      extra_instructions:
        description: 'Additional context for the system prompt'
        required: false
        type: string
        default: ''
    secrets:
      LLM_API_KEY:
        description: 'API key for OpenRouter'
        required: true

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Update PR Summary
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Debug: LLM_API_KEY starts with: ${LLM_API_KEY:0:10}..."

          DIFF_STAT=$(git diff --stat $BASE_SHA...$HEAD_SHA)
          COMMITS=$(git log --oneline --no-merges $BASE_SHA...$HEAD_SHA)

          jq -n \
            --arg diff "$DIFF_STAT" \
            --arg commits "$COMMITS" \
            '{
              model: "openai/gpt-oss-20b:free",
              messages: [
                {
                  role: "system",
                  content: "Ты — Senior разработчик. Пиши краткие, сухие и технические описания для Pull Request на русском языке. Без воды и общих фраз."
                },
                {
                  role: "user",
                  content: ("Напиши описание для PR.\n\nИзменения в файлах:\n" + $diff + "\n\nИстория коммитов:\n" + $commits + "\n\nФормат (Markdown):\n### Описание изменений\n[Краткая суть]\n\n### Ключевые изменения\n- [Пункт 1]\n- [Пункт 2]\n\n### Breaking Changes\n[Нет / Описание]")
                }
              ],
              temperature: 0.2
            }' > payload.json

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
            -H "X-Title: GitHub PR Summary" \
            -d @payload.json)

          HTTP_CODE=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API returned error:"
            echo "$BODY" | jq .
            exit 1
          fi

          SUMMARY=$(echo "$BODY" | jq -r '.choices[0].message.content // empty')

          if [ -z "$SUMMARY" ]; then
            echo "Empty response from API"
            echo "$BODY" | jq .
            exit 1
          fi

          echo "Generated summary:"
          echo "$SUMMARY"

          CURRENT_BODY=$(gh pr view $PR_NUMBER --json body -q '.body')

          if [[ "$CURRENT_BODY" == "null" || -z "$CURRENT_BODY" ]]; then
            gh pr edit $PR_NUMBER --body "$SUMMARY"
          else
            gh pr edit $PR_NUMBER --body "${CURRENT_BODY}

          ---
          ### AI Summary
          ${SUMMARY}"
          fi