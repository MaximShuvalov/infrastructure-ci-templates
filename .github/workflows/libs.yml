name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Find and Sanitize SARIF files
        id: find_sarif
        if: always()
        run: |
          mapfile -t FILES < <(find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \))
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No SARIF files found"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          for FILE in "${FILES[@]}"; do
            echo "Sanitizing: $FILE"
            jq 'del(.runs[].taxonomies)' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
          done
          
          echo "count=${#FILES[@]}" >> $GITHUB_OUTPUT
          printf '%s\n' "${FILES[@]}" > sarif_files.txt
          echo "Found ${#FILES[@]} SARIF files"

      - name: Merge SARIF files using Python
        if: always() && steps.find_sarif.outputs.count > 0
        run: |
          python3 << 'EOF'
          import json
          import sys
          import os

          with open('sarif_files.txt', 'r') as f:
              files = [line.strip() for line in f if line.strip()]

          merged_runs = []
          schema = "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json"
          version = "2.1.0"

          for i, file_path in enumerate(files):
              with open(file_path, 'r') as f:
                  data = json.load(f)
          
              if "$schema" in data:
                  schema = data["$schema"]
              if "version" in data:
                  version = data["version"]
          
              parts = file_path.replace('./', '').split('/')
              module_name = parts[0] if len(parts) > 1 else "unknown"
              tool_name = "detekt" if "detekt" in file_path else "spotbugs"
              unique_category = f"{tool_name}-{module_name}-{i}"

              for run in data.get("runs", []):
                  if "properties" not in run:
                      run["properties"] = {}
                  run["properties"]["category"] = unique_category
                  merged_runs.append(run)

          merged_sarif = {
              "$schema": schema,
              "version": version,
              "runs": merged_runs
          }

          with open("merged.sarif", 'w') as f:
              json.dump(merged_sarif, f, indent=2)
          
          print(f"Successfully merged {len(files)} SARIF files into merged.sarif")
          EOF

      - name: Upload Merged SARIF to GitHub Code Scanning
        if: always() && steps.find_sarif.outputs.count > 0
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged.sarif

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://maven.pkg.github.com/${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}