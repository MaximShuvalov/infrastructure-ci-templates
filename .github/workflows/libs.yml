name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Find and Sanitize SARIF files
        id: find_sarif
        if: always()
        run: |
          mapfile -t FILES < <(find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \))
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No SARIF files found"
            exit 0
          fi
          
          for FILE in "${FILES[@]}"; do
            echo "Sanitizing: $FILE"
            jq 'del(.runs[].taxonomies)' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
          done
          
          echo "Found ${#FILES[@]} SARIF files"
          echo "files=${FILES[*]}" >> $GITHUB_OUTPUT

      - name: Install CodeQL CLI
        uses: github/codeql-action/init@v3
        with:
          languages: ''
          setup-python: false

      - name: Merge SARIF files
        run: |
          IFS=' ' read -ra FILES <<< "${{ steps.find_sarif.outputs.files }}"
          
          MERGED_FILE="merged.sarif"
          
          codeql github merge-results \
            --sarif="${FILES[0]}" \
            --output="$MERGED_FILE"
          
          for (( i=1; i<${#FILES[@]}; i++ )); do
            codeql github merge-results \
              --sarif="$MERGED_FILE" \
              --additional-sarif="${FILES[$i]}" \
              --output="$MERGED_FILE"
          done
          
          jq '.runs |= map( . + { "properties": { "category": "run-\(.index)" } } )' \
            "$MERGED_FILE" > "${MERGED_FILE}.fixed"
          
          echo "Merged and fixed SARIF file: ${MERGED_FILE}.fixed"

      - name: Upload Merged SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged.sarif.fixed
          category: static-analysis

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://maven.pkg.github.com/${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}