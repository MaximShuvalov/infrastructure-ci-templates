name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Collect and Rename SARIF Files
        id: collect_sarif
        if: always()
        run: |
          # Создаем чистую директорию для результатов
          mkdir -p sarif-results
          
          count=0
          
          # Находим все файлы и копируем их с плоскими уникальными именами
          while read -r file; do
            if [ -f "$file" ]; then
              # Извлекаем имя модуля
              MODULE=$(echo "$file" | awk -F'/build/reports/' '{print $1}' | sed 's|^\./||' | tr '/' '-')
              if [ -z "$MODULE" ]; then MODULE="root"; fi
          
              # Определяем инструмент
              TOOL="spotbugs"
              if [[ "$file" == *"detekt"* ]]; then TOOL="detekt"; fi
          
              # Формируем уникальное имя файла, чтобы избежать перезаписи в одной папке
              cp "$file" "sarif-results/${MODULE}-${TOOL}.sarif"
              count=$((count+1))
            fi
          done < <(find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \))
          
          echo "Prepared $count SARIF files for upload."
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Upload SARIF Directory to GitHub Code Scanning
        if: always() && steps.collect_sarif.outputs.count > 0
        uses: github/codeql-action/upload-sarif@v4
        with:
          # Передаем путь к директории, а не маску файла. Это предотвратит ошибку Path does not exist
          sarif_file: 'sarif-results'

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://github.com{{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
