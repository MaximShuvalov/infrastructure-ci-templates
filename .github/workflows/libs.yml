name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Это единственное обязательное разрешение для Code Scanning

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Find and Prepare SARIF Files
        id: process_sarif
        if: always()
        run: |
          # Находим файлы и копируем их в структуру, удобную для загрузки
          mkdir -p sarif-artifacts
          
          # Счетчик найденных файлов
          count=0
          
          # Ищем отчеты detekt и spotbugs
          while read -r file; do
            if [ -f "$file" ]; then
              # Определяем модуль и инструмент
              MODULE=$(echo "$file" | awk -F'/build/reports/' '{print $1}' | sed 's|^\./||' | tr '/' '-')
              if [ -z "$MODULE" ]; then MODULE="root"; fi
          
              TOOL="spotbugs"
              if [[ "$file" == *"detekt"* ]]; then TOOL="detekt"; fi
          
              # Формируем плоское имя файла, кодируя в него модуль и категорию
              # Формат: категория__модуль__имя.sarif
              NEW_NAME="${TOOL}__${MODULE}__report.sarif"
              cp "$file" "sarif-artifacts/$NEW_NAME"
              count=$((count+1))
            fi
          done < <(find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \))
          
          echo "Found and prepared $count SARIF files."
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Upload Detekt SARIF Reports
        if: always() && steps.process_sarif.outputs.count > 0
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true # Предотвращает падение джобы, если один из модулей пустой
        with:
          sarif_file: 'sarif-artifacts/detekt__*__report.sarif'
          category: 'detekt'

      - name: Upload SpotBugs SARIF Reports
        if: always() && steps.process_sarif.outputs.count > 0
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'sarif-artifacts/spotbugs__*__report.sarif'
          category: 'spotbugs'

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://github.com{{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
