name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Find SARIF files
        id: find_sarif
        if: always()
        run: |
          mapfile -t FILES < <(find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \))
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No SARIF files found"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "count=${#FILES[@]}" >> $GITHUB_OUTPUT
          printf '%s\n' "${FILES[@]}" > sarif_files.txt
          echo "Found ${#FILES[@]} SARIF files"

      - name: Merge and Sanitize SARIF files with Node.js
        if: always() && steps.find_sarif.outputs.count > 0
        run: |
          node -e '
          const fs = require("fs");

          const filesContent = fs.readFileSync("sarif_files.txt", "utf8");
          const files = filesContent.split("\n").filter(f => f.trim() !== "");

          let merged = {
            $schema: "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            version: "2.1.0",
            runs: []
          };

          files.forEach((file, index) => {
            let data = JSON.parse(fs.readFileSync(file, "utf8"));
          
            const parts = file.replace("./", "").split("/");
            const module = parts[0] || "root";
            const tool = file.includes("detekt") ? "detekt" : "spotbugs";
            const uniqueCategory = `${tool}-${module}-${index}`;

            if (data.runs) {
              data.runs.forEach((run) => {
                if (run.taxonomies) delete run.taxonomies;
                if (run.tool && run.tool.driver && run.tool.driver.taxonomies) {
                  delete run.tool.driver.taxonomies;
                }
          
                if (!run.properties) run.properties = {};
                run.properties.category = uniqueCategory;
          
                merged.runs.push(run);
              });
            }
          });

          fs.writeFileSync("merged.sarif", JSON.stringify(merged, null, 2));
          console.log("Successfully merged and sanitized " + files.length + " SARIF files.");
          '

      - name: Save Merged SARIF as Artifact
        if: always() && steps.find_sarif.outputs.count > 0
        uses: actions/upload-artifact@v4
        with:
          name: merged-sarif-debug
          path: merged.sarif
          retention-days: 1

      - name: Upload Merged SARIF to GitHub Code Scanning
        if: always() && steps.find_sarif.outputs.count > 0
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged.sarif

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://maven.pkg.github.com/${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}