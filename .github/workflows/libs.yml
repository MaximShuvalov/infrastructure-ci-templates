name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Find Detekt SARIF
        id: find_detekt
        if: always()
        run: |
          FILE=$(find . -type f -path "*/build/reports/detekt/detekt.sarif" | head -n 1)
          if [ -n "$FILE" ]; then
            echo "path=$FILE" >> $GITHUB_OUTPUT
          else
            echo "path=" >> $GITHUB_OUTPUT
          fi

      - name: Upload Detekt SARIF to GitHub
        if: always() && steps.find_detekt.outputs.path != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.find_detekt.outputs.path }}

      - name: Find and Sanitize SpotBugs SARIF
        id: find_spotbugs
        if: always()
        run: |
          FILES=$(find . -type f -path "*/build/reports/spotbugs/main.sarif")
          
          if [ -z "$FILES" ]; then
            echo "path=" >> $GITHUB_OUTPUT
            echo "No SpotBugs SARIF files found"
            exit 0
          fi
          
          while IFS= read -r FILE; do
            echo "Sanitizing: $FILE"
            jq 'del(.runs[].taxonomies)' "$FILE" > "${FILE}.tmp"
            mv "${FILE}.tmp" "$FILE"
          done <<< "$FILES"
          
          FIRST_FILE=$(echo "$FILES" | head -n 1)
          echo "path=$FIRST_FILE" >> $GITHUB_OUTPUT
          echo "Sanitized files: $FILES"

      - name: Upload SpotBugs SARIF to GitHub
        if: always() && steps.find_spotbugs.outputs.path != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.find_spotbugs.outputs.path }}

  publish:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            ./gradlew --no-daemon publish \
              -Pversion="${VERSION#v}" \
              -PgithubMavenRepositoryUrl="https://maven.pkg.github.com/${{ github.repository }}"
          else
            ./gradlew --no-daemon publish \
              -PgithubMavenRepositoryUrl="https://maven.pkg.github.com/${{ github.repository }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}