name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Prepare SARIF files for upload
        if: always()
        run: |
          mkdir -p sarif-reports
          
          find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \) | while read FILE; do
            if [ -f "$FILE" ]; then
              echo "Sanitizing: $FILE"
              jq 'del(.runs[].taxonomies)' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
          
              MODULE_NAME=$(echo "$FILE" | sed 's|/build/.*||' | sed 's|^\./||' | tr '/' '_')
              cp "$FILE" "sarif-reports/${MODULE_NAME}.sarif"
            fi
          done
          
          echo "Prepared $(ls -1 sarif-reports/*.sarif 2>/dev/null | wc -l) SARIF files"

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-reports/
          category: static-analysis

      - name: Publish to GitHub Packages
        if: github.ref_type == 'tag'
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://maven.pkg.github.com/${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}