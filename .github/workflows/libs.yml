name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # Минимальное и единственное разрешение для Code Scanning

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Upload SARIF Reports directly via GitHub CLI
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ищем все сгенерированные SARIF отчеты
          FILES=$(find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \))
          
          if [ -z "$FILES" ]; then
            echo "No SARIF files found."
            exit 0
          fi

          # Построчно обрабатываем каждый файл
          echo "$FILES" | while read -r file; do
            if [ -f "$file" ]; then
              # Извлекаем имя модуля (например, :core или :app). Если корень, то "root"
              MODULE=$(echo "$file" | awk -F'/build/reports/' '{print $1}' | sed 's|^\./||' | tr '/' '-')
              if [ -z "$MODULE" ]; then MODULE="root"; fi
          
              # Определяем инструмент для категории
              TOOL="spotbugs"
              if [[ "$file" == *"detekt"* ]]; then TOOL="detekt"; fi
          
              # Формируем уникальную категорию: инструмент + модуль
              CATEGORY="${TOOL}-${MODULE}"
              echo "Uploading $file to Code Scanning with category: $CATEGORY"
          
              # Загружаем напрямую через встроенный в раннер CLI, минуя баги с масками в экшенах
              gh code-scanning upload-sarif \
                --sarif-file="$file" \
                --commit="${{ github.sha }}" \
                --ref="${{ github.ref }}" \
                --category="$CATEGORY"
            fi
          done

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://github.com{{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
