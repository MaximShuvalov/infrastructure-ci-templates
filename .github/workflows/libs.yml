name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Sanitize and Collect SARIF Files with Node.js
        if: always()
        id: collect_sarif
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // Функция рекурсивного поиска файлов
          function findFiles(dir, pattern, fileList = []) {
            const files = fs.readdirSync(dir);
            files.forEach(file => {
              const filePath = path.join(dir, file);
              const stat = fs.statSync(filePath);
              if (stat.isDirectory()) {
                findFiles(filePath, pattern, fileList);
              } else if (filePath.replace(/\\/g, "/").includes(pattern)) {
                fileList.push(filePath);
              }
            });
            return fileList;
          }

          const targetDir = "sarif-results";
          if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir);

          // Ищем отчеты detekt и spotbugs
          const detektFiles = findFiles(".", "build/reports/detekt/detekt.sarif");
          const spotbugsFiles = findFiles(".", "build/reports/spotbugs/main.sarif");
          const allFiles = [...detektFiles, ...spotbugsFiles];

          let count = 0;

          allFiles.forEach(file => {
            if (!fs.existsSync(file)) return;

            // Извлекаем название Gradle-модуля из пути
            const parts = file.replace(/\\/g, "/").replace("./", "").split("/");
            const module = parts[0] === "build" ? "root" : parts[0];
            const tool = file.includes("detekt") ? "detekt" : "spotbugs";

            try {
              let data = JSON.parse(fs.readFileSync(file, "utf8"));

              // Санитизация: удаляем невалидные поля taxonomies, ломающие схему GitHub
              if (data.runs) {
                data.runs.forEach(run => {
                  if (run.taxonomies) delete run.taxonomies;
                  if (run.tool && run.tool.driver && run.tool.driver.taxonomies) {
                    delete run.tool.driver.taxonomies;
                  }
          
                  // Прописываем уникальную категорию внутри самого SARIF-файла
                  if (!run.properties) run.properties = {};
                  run.properties.category = `${tool}-${module}`;
                });
              }

              // Записываем очищенный файл с плоским именем
              const outputName = path.join(targetDir, `${module}-${tool}.sarif`);
              fs.writeFileSync(outputName, JSON.stringify(data, null, 2));
              count++;
              console.log(`Successfully sanitized and copied: ${file} -> ${outputName}`);
            } catch (err) {
              console.error(`Failed to process ${file}:`, err.message);
            }
          });

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${count}\n`);
          '

      - name: Upload Cleaned SARIF Directory to GitHub Code Scanning
        if: always() && steps.collect_sarif.outputs.count > 0
        uses: github/codeql-action/upload-sarif@v4
        with:
          # Загружаем всю папку с гарантированно валидными SARIF файлами
          sarif_file: 'sarif-results'

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://github.com{{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
