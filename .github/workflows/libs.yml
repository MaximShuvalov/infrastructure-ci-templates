name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Sanitize SARIF and Generate Upload Manifest
        if: always()
        id: sanitize_sarif
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function findFiles(dir, pattern, fileList = []) {
            const files = fs.readdirSync(dir);
            files.forEach(file => {
              const filePath = path.join(dir, file);
              const stat = fs.statSync(filePath);
              if (stat.isDirectory()) {
                findFiles(filePath, pattern, fileList);
              } else if (filePath.replace(/\\/g, "/").includes(pattern)) {
                fileList.push(filePath);
              }
            });
            return fileList;
          }

          const targetDir = "sarif-cleaned";
          if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir);

          const detektFiles = findFiles(".", "build/reports/detekt/detekt.sarif");
          const spotbugsFiles = findFiles(".", "build/reports/spotbugs/main.sarif");
          const allFiles = [...detektFiles, ...spotbugsFiles];

          let manifestLines = [];

          allFiles.forEach(file => {
            if (!fs.existsSync(file)) return;

            const parts = file.replace(/\\/g, "/").replace("./", "").split("/");
            const module = parts === "build" ? "root" : parts;
            const tool = file.includes("detekt") ? "detekt" : "spotbugs";
            const category = `${tool}-${module}`;

            try {
              let data = JSON.parse(fs.readFileSync(file, "utf8"));

              // Очищаем ломающие схему taxonomies
              if (data.runs) {
                data.runs.forEach(run => {
                  if (run.taxonomies) delete run.taxonomies;
                  if (run.tool && run.tool.driver && run.tool.driver.taxonomies) {
                    delete run.tool.driver.taxonomies;
                  }
          
                  // Прописываем категорию прямо в SARIF файл. GitHub прочитает её отсюда!
                  if (!run.properties) run.properties = {};
                  run.properties.category = category;
                });
              }

              const outputName = path.join(targetDir, `${category}.sarif`);
              fs.writeFileSync(outputName, JSON.stringify(data, null, 2));
          
              manifestLines.push(`${outputName}|${category}`);
              console.log(`Sanitized: ${file} -> ${outputName} (Category: ${category})`);
            } catch (err) {
              console.error(`Failed to process ${file}:`, err.message);
            }
          });

          if (manifestLines.length > 0) {
            fs.writeFileSync("sarif_manifest.txt", manifestLines.join("\n"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_files=true\n");
          } else {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_files=false\n");
          }
          '

      - name: Upload SARIF Files Sequentially via REST API
        if: always() && steps.sanitize_sarif.outputs.has_files == 'true'
        run: |
          # Построчно читаем подготовленный манифест файлов
          while IFS="|" read -r file category; do
            if [ -f "$file" ]; then
              echo "::group::Uploading $category"
          
              # Архивируем в gzip и кодируем в base64, как требует REST API GitHub
              SARIF_BASE64=$(gzip -c "$file" | base64 -w 0)
          
              # Отправляем файл. Поле category удалено из ключей gh, так как оно уже внутри SARIF
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                /repos/${{ github.repository }}/code-scanning/sarifs \
                -f commit_sha="${{ github.sha }}" \
                -f ref="${{ github.ref }}" \
                -f sarif="$SARIF_BASE64" \
                -f tool_name="${category%%-*}"
          
              echo "::endgroup::"
            fi
          done < sarif_manifest.txt
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://github.com{{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
