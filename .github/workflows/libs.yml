name: Gradle Maven Publish Template

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        type: string
        default: '21'
    secrets:
      PUBLISH_TOKEN:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Build and All Checks
        run: ./gradlew --no-daemon clean check

      - name: Find and Sanitize SARIF files
        id: find_sarif
        if: always()
        run: |
          mapfile -t FILES < <(find . -type f \( -path "*/build/reports/detekt/detekt.sarif" -o -path "*/build/reports/spotbugs/main.sarif" \))
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No SARIF files found"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          for FILE in "${FILES[@]}"; do
            echo "Sanitizing: $FILE"
            jq 'del(.runs[].taxonomies)' "$FILE" > "${FILE}.tmp" && mv "${FILE}.tmp" "$FILE"
          done
          
          echo "count=${#FILES[@]}" >> $GITHUB_OUTPUT
          printf '%s\n' "${FILES[@]}" > sarif_files.txt
          echo "Found ${#FILES[@]} SARIF files"

      - name: Download CodeQL CLI
        if: always() && steps.find_sarif.outputs.count > 0
        run: |
          curl -L https://github.com/github/codeql-cli-binaries/releases/latest/download/codeql-linux64.zip -o codeql.zip
          unzip -q codeql.zip
          chmod +x codeql/codeql

      - name: Merge SARIF files
        if: always() && steps.find_sarif.outputs.count > 0
        run: |
          mapfile -t FILES < <(cat sarif_files.txt)
          COUNT=${#FILES[@]}
          
          echo "Merging $COUNT SARIF files..."
          
          if [ "$COUNT" -eq 1 ]; then
            cp "${FILES[0]}" merged.sarif
          else
            # Первый файл — база
            cp "${FILES[0]}" merged.sarif
          
            # Последовательно мержим каждый следующий файл
            for (( i=1; i<COUNT; i++ )); do
              echo "Merging with: ${FILES[$i]}"
              ./codeql/codeql github merge-results \
                --sarif=merged.sarif \
                --sarif="${FILES[$i]}" \
                --output=merged.sarif.tmp
              mv merged.sarif.tmp merged.sarif
            done
          fi
          
          # Добавляем уникальные категории для каждого run
          jq '[.runs | to_entries[] | .value + { "properties": { "category": ("run-" + (.key | tostring)) } }]' \
            merged.sarif > merged.sarif.fixed
          
          echo "Merged and categorized $COUNT SARIF files"

      - name: Upload Merged SARIF to GitHub Code Scanning
        if: always() && steps.find_sarif.outputs.count > 0
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: merged.sarif.fixed
          category: static-analysis

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          VERSION="${{ github.ref_name }}"
          ./gradlew --no-daemon publish \
            -Pversion="${VERSION#v}" \
            -PgithubMavenRepositoryUrl="https://maven.pkg.github.com/${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}